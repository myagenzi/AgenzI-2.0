<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgenzI — About</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#000;color:#fff;font-family:'Space Grotesk',sans-serif;overflow-x:hidden;cursor:none}
#cursor-orb{position:fixed;top:0;left:0;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#FFD166 0%,#B983FF 45%,#3A6FD8 100%);box-shadow:0 0 12px 4px rgba(138,92,255,0.5),0 0 24px 8px rgba(255,178,0,0.2);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .08s ease,width .2s ease,height .2s ease,opacity .3s ease;mix-blend-mode:screen}
#cursor-trail{position:fixed;top:0;left:0;width:36px;height:36px;border-radius:50%;border:1px solid rgba(138,92,255,0.35);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .18s ease,width .3s ease,height .3s ease,opacity .3s ease;background:radial-gradient(circle,rgba(255,209,102,0.04) 0%,transparent 70%)}
body:hover #cursor-orb{opacity:1}
a:hover ~ #cursor-orb,button:hover ~ #cursor-orb{transform:translate(-50%,-50%) scale(1.6)}
.liquid-glass{background:rgba(255,255,255,0.01);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(145deg,rgba(185,131,255,0.35) 0%,rgba(58,111,216,0.15) 30%,rgba(255,255,255,0) 50%,rgba(217,70,239,0.1) 80%,rgba(255,178,0,0.2) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#main-nav{transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s ease}
#main-nav.nav-hidden{transform:translateY(-110%);opacity:0}
.footer-compact{border-top:1px solid transparent;border-image:linear-gradient(to right,transparent,rgba(138,92,255,0.25),rgba(255,178,0,0.15),transparent) 1}
::selection{background:rgba(138,92,255,0.35)}
a{color:#B983FF}
a:hover{color:#D9B8FF}
</style>
</head>
<body>
<div id="cursor-orb"></div>
<div id="cursor-trail"></div>
<div id="root"></div>
<script src="logos.js"></script>
<script>
(function() {
  const orb = document.getElementById('cursor-orb');
  const trail = document.getElementById('cursor-trail');
  let mx = -100, my = -100, tx = -100, ty = -100;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function tick() {
    tx += (mx - tx) * 0.18;
    ty += (my - ty) * 0.18;
    orb.style.left = mx + 'px';
    orb.style.top = my + 'px';
    trail.style.left = tx + 'px';
    trail.style.top = ty + 'px';
    requestAnimationFrame(tick);
  }
  tick();
  document.addEventListener('mouseover', e => {
    if (e.target.closest('a, button')) {
      orb.style.width = '28px'; orb.style.height = '28px';
      orb.style.boxShadow = '0 0 20px 8px rgba(138,92,255,0.7), 0 0 40px 16px rgba(255,178,0,0.3)';
      trail.style.width = '56px'; trail.style.height = '56px';
      trail.style.borderColor = 'rgba(185,131,255,0.5)';
    }
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('a, button')) {
      orb.style.width = '18px'; orb.style.height = '18px';
      orb.style.boxShadow = '0 0 12px 4px rgba(138,92,255,0.5), 0 0 24px 8px rgba(255,178,0,0.2)';
      trail.style.width = '36px'; trail.style.height = '36px';
      trail.style.borderColor = 'rgba(138,92,255,0.35)';
    }
  });
})();
</script>
<script type="text/babel">
const { useRef, useEffect, useState } = React;

function ArrowUpRight({ size = 20 }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>);
}

function Navbar() {
  const lastY = useRef(0);
  useEffect(() => {
    const nav = document.getElementById('main-nav');
    const onScroll = () => {
      const y = window.scrollY;
      if (y < 60) nav.classList.remove('nav-hidden');
      else if (y > lastY.current + 8) nav.classList.add('nav-hidden');
      else if (y < lastY.current - 8) nav.classList.remove('nav-hidden');
      lastY.current = y;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const links = [['Services','AgenzI Services.html'],['Work','AgenzI Work.html'],['Pricing','AgenzI Pricing.html'],['Notes','AgenzI Notes.html'],['About','AgenzI About.html']];
  return (
    <nav id="main-nav" style={{ position: 'fixed', top: 16, left: 0, right: 0, zIndex: 50, padding: '0 2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <a href="AgenzI.html" style={{ display: 'flex', alignItems: 'center', flexShrink: 0 }}>
        <img src={window.LOGO_HORIZONTAL} alt="AgenzI" style={{ height: 48, display: 'block', objectFit: 'contain' }} />
      </a>
      <div className="liquid-glass" style={{ display: 'flex', alignItems: 'center', borderRadius: 9999, padding: '6px 6px', gap: 2 }}>
        {links.map(([label, href]) =>
          <a key={label} href={href} style={{ padding: '8px 14px', fontSize: 13, fontWeight: label === 'About' ? 600 : 500, color: label === 'About' ? '#B983FF' : 'rgba(255,255,255,0.85)', textDecoration: 'none', borderRadius: 9999 }}>{label}</a>
        )}
        <a href="AgenzI Free Report.html" style={{ padding: '8px 18px', fontSize: 13, fontWeight: 600, background: 'linear-gradient(135deg, #6C3FCF, #3A6FD8)', color: '#fff', borderRadius: 9999, textDecoration: 'none', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: 6, boxShadow: '0 0 16px rgba(108,63,207,0.4)' }}>Get your free AI report</a>
      </div>
      <div style={{ width: 64 }}></div>
    </nav>);
}

function Footer() {
  return (
    <footer className="footer-compact" style={{ padding: '32px clamp(24px, 6vw, 80px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <img src={window.LOGO_HORIZONTAL} alt="AgenzI" style={{ height: 36, objectFit: 'contain', display: 'block' }} />
          <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)' }}>Create · Market · Run</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          {['Services', 'Work', 'Notes', 'Pricing', 'About', 'Zenzai', 'AI Audit', 'Privacy', 'Terms'].map(l =>
            <a key={l} href={{Services:'AgenzI Services.html',Work:'AgenzI Work.html',Notes:'AgenzI Notes.html',Pricing:'AgenzI Pricing.html',About:'AgenzI About.html','AI Audit':'AgenzI Audit.html',Privacy:'AgenzI Privacy.html',Terms:'AgenzI Terms.html'}[l] || '#'} style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', textDecoration: 'none' }}>{l}</a>)}
        </div>
      </div>
      <p style={{ textAlign: 'center', fontSize: 11, color: 'rgba(255,255,255,0.2)', marginTop: 20 }}>© 2026 AgenzI. All rights reserved.</p>
    </footer>);
}

const kicker = { display: 'inline-flex', borderRadius: 9999, padding: '5px 16px', fontSize: 12, color: 'rgba(255,255,255,0.6)', marginBottom: 20 };
const h2Style = { fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(2rem, 4.2vw, 3.2rem)', color: '#fff', lineHeight: 1.08, letterSpacing: '-2px', maxWidth: 760, marginBottom: 16 };
const bodyMuted = { fontSize: 14, color: 'rgba(255,255,255,0.55)', lineHeight: 1.7 };
const ctaGrad = { background: 'linear-gradient(135deg,#6C3FCF,#3A6FD8)' };

/* ── Hero ── */
function Hero() {
  return (
    <>
    <section style={{ padding: '200px clamp(24px,6vw,80px) 90px' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto', paddingTop: 50 }}>
        <div className="liquid-glass" style={kicker}>// ABOUT</div>
        <h1 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(2.4rem,6vw,4.6rem)', color: '#fff', letterSpacing: '-3px', lineHeight: 1.02, maxWidth: 820, marginBottom: 28 }}>Human plus AI.</h1>
        <p style={{ fontSize: 17, color: 'rgba(255,255,255,0.65)', lineHeight: 1.7, maxWidth: 640, marginBottom: 20 }}>AgenzI is a human-led, AI-accelerated agency. We believe no person should do work a machine can do — and that every machine needs a person to aim it.</p>
        <p style={{ fontSize: 15, color: 'rgba(255,255,255,0.5)', lineHeight: 1.7, maxWidth: 600 }}>We help businesses create, market and run the things they need, using AI for speed and humans for judgment.</p>
      </div>
    </section>
    <ValuesInner />
    </>);
}

function ValuesInner() {
  const values = [
    { title: 'No person should do work a machine can do', body: 'We automate the repetitive, the slow, and the scalable — so people can focus on judgment, taste, and relationships.' },
    { title: 'Every output has a human owner', body: 'AI produces. People approve. There is always a named person responsible for what goes out the door.' },
    { title: 'Published, capped, visible', body: 'Our rates are public, every engagement has a cap, and you can see where time goes. No hidden hours.' },
    { title: 'Fit before flash', body: 'We do not chase trends. We build what fits your business, your customers, and the outcome you are trying to reach.' },
  ];
  return (
    <section style={{ padding: 'clamp(80px,12vw,140px) clamp(24px,6vw,80px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <div className="liquid-glass" style={kicker}>// Values</div>
        <h2 style={h2Style}>What we believe</h2>

              <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.55)', lineHeight: 1.65 }}>{v.body}</p>
            </div>)}
        </div>
      </div>
    </section>);
}

/* ── How we work ── */
function HowWeWork() {
  const steps = [
    { n: '1', title: 'Find where AI fits', body: 'We start by mapping your work. Then we identify the parts AI can handle without losing quality or trust.' },
    { n: '2', title: 'Build it with judgment', body: 'AI accelerates production. Our team makes the design, strategy, and architecture decisions that shape the result.' },
    { n: '3', title: 'Run it under human supervision', body: 'Systems need owners. We keep a person in the loop for review, exceptions, and continuous improvement.' },
  ];
  return (
    <section style={{ padding: 'clamp(80px,12vw,140px) clamp(24px,6vw,80px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <div className="liquid-glass" style={kicker}>// How we work</div>
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap', marginBottom: 16 }}>
          <h2 style={{ ...h2Style, marginBottom: 0 }}>Find it. Build it. Run it.</h2>
          <a href="AgenzI Services.html" style={{ fontSize: 13, color: 'rgba(255,255,255,0.7)', textDecoration: 'none', display: 'flex', alignItems: 'center', gap: 6, whiteSpace: 'nowrap', marginTop: 12 }}>See our services <ArrowUpRight size={14} /></a>
        </div>
        <p style={{ ...bodyMuted, maxWidth: 620, marginBottom: 32 }}>Our process is built around one idea: AI should do the work it is good at, and people should own the parts that matter.</p>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 16 }}>
          {steps.map(s =>
            <div key={s.n} className="liquid-glass" style={{ borderRadius: '1.5rem', padding: 28, display: 'flex', flexDirection: 'column', gap: 14 }}>
              <span style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 26, color: '#8A5CFF' }}>{s.n}</span>
              <h3 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 18, color: '#fff', lineHeight: 1.25 }}>{s.title}</h3>
              <p style={{ fontSize: 13.5, color: 'rgba(255,255,255,0.55)', lineHeight: 1.6 }}>{s.body}</p>
            </div>)}
        </div>
      </div>
    </section>);
}

/* ── Team ── */
function Team() {
  return (
    <section style={{ padding: 'clamp(80px,12vw,140px) clamp(24px,6vw,80px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <div className="liquid-glass" style={kicker}>// Team</div>
        <h2 style={h2Style}>The people behind the work</h2>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4,1fr)', gap: 16, margin: '32px 0 24px' }}>
          {[0,1,2,3].map(i =>
            <div key={i} className="liquid-glass" style={{ borderRadius: '1.5rem', overflow: 'hidden', display: 'flex', flexDirection: 'column' }}>
              <div style={{ aspectRatio: '1', background: 'repeating-linear-gradient(135deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 14px)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                <span style={{ fontFamily: 'monospace', fontSize: 11, color: 'rgba(255,255,255,0.25)' }}>[ headshot ]</span>
              </div>
              <div style={{ padding: 18 }}>
                <p style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 15, color: 'rgba(255,255,255,0.4)' }}>placeholder</p>
                <p style={{ fontSize: 12, color: 'rgba(255,255,255,0.3)' }}>placeholder</p>
              </div>
            </div>)}
        </div>
        <p style={{ ...bodyMuted, maxWidth: 560 }}>Team details will be added as the company grows. For now, every project is led by an experienced operator with direct accountability.</p>
      </div>
    </section>);
}

/* ── Why AgenzI ── */
function WhyAgenzI() {
  const items = [
    'Transparent per-minute pricing with a cap',
    'Named human owner on every project',
    'AI used for speed, not as a replacement for judgment',
    'Modular services that fit together as you grow',
    'Unused minutes roll forward',

  return (
    <section style={{ padding: 'clamp(80px,12vw,140px) clamp(24px,6vw,80px)' }}>

          {items.map(it =>

              <span style={{ color: '#8A5CFF', fontSize: 16 }}>·</span>

        </div>
        <div className="liquid-glass" style={{ borderRadius: '1.5rem', padding: 'clamp(28px,4vw,44px)', textAlign: 'center' }}>
          <p style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontStyle: 'italic', fontWeight: 600, fontSize: 'clamp(1.3rem, 2.4vw, 1.9rem)', color: '#fff', lineHeight: 1.4, letterSpacing: '-0.5px', maxWidth: 700, margin: '0 auto 16px' }}>
            "We are not trying to replace people. We are trying to give them better tools."
          </p>
          <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)' }}>— AgenzI founding principle</p>
        </div>
      </div>
    </section>);
}

/* ── Final CTA ── */
function FinalCTA() {
  return (
    <section id="cta" style={{ padding: 'clamp(80px, 12vw, 140px) clamp(24px, 6vw, 80px)', textAlign: 'center' }}>
      <div style={{ maxWidth: 700, margin: '0 auto' }}>
        <h2 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(2rem, 4.2vw, 3.2rem)', color: '#fff', letterSpacing: '-2px', marginBottom: 16 }}>Let's see what AI can do for you</h2>
        <p style={{ fontSize: 15, color: 'rgba(255,255,255,0.55)', lineHeight: 1.6, marginBottom: 32 }}>Get a free AI report with specific recommendations for your business.</p>
        <div style={{ display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap', justifyContent: 'center' }}>
          <a href="AgenzI Free Report.html" style={{ borderRadius: 9999, padding: '13px 30px', fontSize: 14, fontWeight: 600, color: '#fff', display: 'flex', alignItems: 'center', gap: 8, textDecoration: 'none', ...ctaGrad, boxShadow: '0 0 24px rgba(108,63,207,0.45)' }}>Get your free AI report <ArrowUpRight size={16} /></a>
          <a href="AgenzI Free Report.html" className="liquid-glass" style={{ borderRadius: 9999, padding: '13px 30px', fontSize: 14, fontWeight: 500, color: 'rgba(255,255,255,0.85)', textDecoration: 'none' }}>Contact us</a>
        </div>
      </div>
    </section>);
}

function App() {
  return (
    <div style={{ position: 'relative', minHeight: '100vh' }}>
      <video autoPlay muted loop playsInline src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260818_072341_50851634-bbc3-4c33-9acc-7647d4db44aa.mp4" style={{ position: 'fixed', top: 0, left: 0, width: '100%', height: '100%', objectFit: 'cover', zIndex: -2, opacity: 1 }}></video>

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
