<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgenzI — Free AI Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#000;color:#fff;font-family:'Space Grotesk',sans-serif;overflow-x:hidden;cursor:none}
#cursor-orb{position:fixed;top:0;left:0;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#FFD166 0%,#B983FF 45%,#3A6FD8 100%);box-shadow:0 0 12px 4px rgba(138,92,255,0.5),0 0 24px 8px rgba(255,178,0,0.2);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .08s ease,width .2s ease,height .2s ease,opacity .3s ease;mix-blend-mode:screen}
#cursor-trail{position:fixed;top:0;left:0;width:36px;height:36px;border-radius:50%;border:1px solid rgba(138,92,255,0.35);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .18s ease,width .3s ease,height .3s ease,opacity .3s ease;background:radial-gradient(circle,rgba(255,209,102,0.04) 0%,transparent 70%)}
body:hover #cursor-orb{opacity:1}
a:hover ~ #cursor-orb,button:hover ~ #cursor-orb{transform:translate(-50%,-50%) scale(1.6)}
.liquid-glass{background:rgba(255,255,255,0.01);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(145deg,rgba(185,131,255,0.35) 0%,rgba(58,111,216,0.15) 30%,rgba(255,255,255,0) 50%,rgba(217,70,239,0.1) 80%,rgba(255,178,0,0.2) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#main-nav{transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s ease}
#main-nav.nav-hidden{transform:translateY(-110%);opacity:0}
.footer-compact{border-top:1px solid transparent;border-image:linear-gradient(to right,transparent,rgba(138,92,255,0.25),rgba(255,178,0,0.15),transparent) 1}
::selection{background:rgba(138,92,255,0.35)}
a{color:#B983FF}
a:hover{color:#D9B8FF}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,0.3)}
.hp{position:absolute;left:-9999px;opacity:0}
</style>
</head>
<body>
<div id="cursor-orb"></div>
<div id="cursor-trail"></div>
<video id="bg-video" autoplay muted loop playsinline src="uploads/molten-metal-1789240866575.mp4" style="position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2"></video><div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.55);z-index:-1"></div>
<div id="root"></div>
<script src="logos.js"></script>
<script>
(function() {
  const orb = document.getElementById('cursor-orb');
  const trail = document.getElementById('cursor-trail');
  let mx = -100, my = -100, tx = -100, ty = -100;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function tick() {
    tx += (mx - tx) * 0.18; ty += (my - ty) * 0.18;
    orb.style.left = mx + 'px'; orb.style.top = my + 'px';
    trail.style.left = tx + 'px'; trail.style.top = ty + 'px';
    requestAnimationFrame(tick);
  }
  tick();
  document.addEventListener('mouseover', e => {
    if (e.target.closest('a, button')) {
      orb.style.width = '28px'; orb.style.height = '28px';
      orb.style.boxShadow = '0 0 20px 8px rgba(138,92,255,0.7), 0 0 40px 16px rgba(255,178,0,0.3)';
      trail.style.width = '56px'; trail.style.height = '56px';
      trail.style.borderColor = 'rgba(185,131,255,0.5)';
    }
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('a, button')) {
      orb.style.width = '18px'; orb.style.height = '18px';
      orb.style.boxShadow = '0 0 12px 4px rgba(138,92,255,0.5), 0 0 24px 8px rgba(255,178,0,0.2)';
      trail.style.width = '36px'; trail.style.height = '36px';
      trail.style.borderColor = 'rgba(138,92,255,0.35)';
    }
  });
})();
</script>
<script type="text/babel">
const { useRef, useEffect, useState } = React;

function ArrowUpRight({ size = 20 }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>);
}

function Navbar() {
  const lastY = useRef(0);
  useEffect(() => {
    const nav = document.getElementById('main-nav');
    const onScroll = () => {
      const y = window.scrollY;
      if (y < 60) nav.classList.remove('nav-hidden');
      else if (y > lastY.current + 8) nav.classList.add('nav-hidden');
      else if (y < lastY.current - 8) nav.classList.remove('nav-hidden');
      lastY.current = y;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const links = [['Services','AgenzI Services.html'],['Work','AgenzI Work.html'],['Pricing','AgenzI Pricing.html'],['Notes','AgenzI Notes.html'],['About','AgenzI About.html']];
  return (
    <nav id="main-nav" style={{ position: 'fixed', top: 16, left: 0, right: 0, zIndex: 50, padding: '0 2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <a href="AgenzI.html" style={{ display: 'flex', alignItems: 'center', flexShrink: 0 }}>
        <img src={window.LOGO_HORIZONTAL} alt="AgenzI" style={{ height: 48, display: 'block', objectFit: 'contain' }} />
      </a>
      <div className="liquid-glass" style={{ display: 'flex', alignItems: 'center', borderRadius: 9999, padding: '6px 6px', gap: 2 }}>
        {links.map(([label, href]) =>
          <a key={label} href={href} style={{ padding: '8px 14px', fontSize: 13, fontWeight: 500, color: 'rgba(255,255,255,0.85)', textDecoration: 'none', borderRadius: 9999 }}>{label}</a>
        )}
        <a href="AgenzI Free Report.html" style={{ padding: '8px 18px', fontSize: 13, fontWeight: 600, background: 'linear-gradient(135deg, #6C3FCF, #3A6FD8)', color: '#fff', borderRadius: 9999, textDecoration: 'none', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: 6, boxShadow: '0 0 16px rgba(108,63,207,0.4)' }}>Get your free AI report</a>
      </div>
      <div style={{ width: 64 }}></div>
    </nav>);
}

function Footer() {
  return (
    <footer className="footer-compact" style={{ padding: '32px clamp(24px, 6vw, 80px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <img src={window.LOGO_HORIZONTAL} alt="AgenzI" style={{ height: 36, objectFit: 'contain', display: 'block' }} />
          <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)' }}>Create · Market · Run</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          {['Services', 'Work', 'Notes', 'Pricing', 'About', 'Zenzai', 'AI Audit', 'Privacy', 'Terms'].map(l =>
            <a key={l} href={{Services:'AgenzI Services.html',Work:'AgenzI Work.html',Notes:'AgenzI Notes.html',Pricing:'AgenzI Pricing.html',About:'AgenzI About.html','AI Audit':'AgenzI Audit.html',Privacy:'AgenzI Privacy.html',Terms:'AgenzI Terms.html'}[l] || '#'} style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', textDecoration: 'none' }}>{l}</a>)}
        </div>
      </div>
      <p style={{ textAlign: 'center', fontSize: 11, color: 'rgba(255,255,255,0.2)', marginTop: 20 }}>© 2026 AgenzI. All rights reserved.</p>
    </footer>);
}

const kicker = { display: 'inline-flex', borderRadius: 9999, padding: '5px 16px', fontSize: 12, color: 'rgba(255,255,255,0.6)', marginBottom: 20 };
const ctaGrad = { background: 'linear-gradient(135deg,#6C3FCF,#3A6FD8)' };
const labelStyle = { fontSize: 13, fontWeight: 600, color: '#fff', display: 'block', marginBottom: 8 };
const helperStyle = { fontSize: 12, color: 'rgba(255,255,255,0.4)', marginTop: 6, fontStyle: 'italic' };
const inputStyle = (err) => ({ width: '100%', background: 'rgba(255,255,255,0.04)', border: '1px solid ' + (err ? 'rgba(244,63,94,0.6)' : 'rgba(255,255,255,0.15)'), borderRadius: '0.75rem', padding: '13px 16px', fontSize: 14, color: '#fff', fontFamily: "'Space Grotesk', sans-serif" });

function Field({ label, value, onChange, placeholder, helper, error, textarea, required = true }) {
  const Tag = textarea ? 'textarea' : 'input';
  return (
    <div>
      <label style={labelStyle}>{label}{required && <span style={{ color: '#B983FF' }}> *</span>}</label>
      <Tag value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} rows={textarea ? 3 : undefined} style={{ ...inputStyle(error), ...(textarea ? { resize: 'vertical', fontFamily: 'inherit' } : {}) }} />
      {helper && <p style={helperStyle}>{helper}</p>}
      {error && <p style={{ fontSize: 12, color: '#F87171', marginTop: 6 }}>This field is required.</p>}
    </div>);
}

function ChipSelect({ label, value, onChange, options, error, required = true }) {
  return (
    <div>
      <label style={labelStyle}>{label}{required && <span style={{ color: '#B983FF' }}> *</span>}</label>
      <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
        {options.map(o =>
          <button key={o} type="button" onClick={() => onChange(o)} style={{ fontSize: 13, padding: '9px 16px', borderRadius: 9999, cursor: 'pointer', border: value === o ? '1px solid rgba(138,92,255,0.6)' : '1px solid ' + (error ? 'rgba(244,63,94,0.5)' : 'rgba(255,255,255,0.15)'), background: value === o ? 'rgba(138,92,255,0.18)' : 'rgba(255,255,255,0.03)', color: value === o ? '#B983FF' : 'rgba(255,255,255,0.7)' }}>{o}</button>)}
      </div>
      {error && <p style={{ fontSize: 12, color: '#F87171', marginTop: 6 }}>Please choose one.</p>}
    </div>);
}

function FreeReportForm() {
  const [f, setF] = useState({ what: '', size: '', area: '', repeat: '', tools: '', failed: '', fix: '', name: '', email: '', website: '', hp: '' });
  const [agree, setAgree] = useState(false);
  const [errors, setErrors] = useState({});
  const [submitted, setSubmitted] = useState(false);
  const set = (k) => (v) => setF(prev => ({ ...prev, [k]: v }));

  function submit(e) {
    e.preventDefault();
    if (f.hp) { setSubmitted(true); return; } // honeypot: silently succeed for bots
    const required = ['what','size','area','repeat','tools','fix','name','email'];
    const errs = {};
    required.forEach(k => { if (!f[k].trim()) errs[k] = true; });
    if (!agree) errs.agree = true;
    setErrors(errs);
    if (Object.keys(errs).length === 0) setSubmitted(true);
  }

  if (submitted) {
    return (
      <div className="liquid-glass" style={{ borderRadius: '1.5rem', padding: 'clamp(32px,5vw,56px)', textAlign: 'center', maxWidth: 640, margin: '0 auto' }}>
        <h2 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(1.8rem,3vw,2.4rem)', color: '#fff', marginBottom: 16, letterSpacing: '-1px' }}>That's in.</h2>
        <p style={{ fontSize: 15, color: 'rgba(255,255,255,0.6)', lineHeight: 1.7, marginBottom: 10 }}>We'll read it properly and send your report within two working days.</p>
        <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.5)', lineHeight: 1.7, marginBottom: 32 }}>If we need one clarification, we'll email — no calls unless you want one.</p>
        <div style={{ display: 'flex', gap: 16, justifyContent: 'center', flexWrap: 'wrap' }}>
          <a href="AgenzI Services.html" style={{ fontSize: 13, color: '#fff', textDecoration: 'none', borderRadius: 9999, padding: '11px 22px', border: '1px solid rgba(255,255,255,0.2)' }}>See what we do</a>
          <a href="AgenzI Pricing.html" style={{ fontSize: 13, color: '#fff', textDecoration: 'none', borderRadius: 9999, padding: '11px 22px', ...ctaGrad }}>How our pricing works</a>
        </div>
      </div>);
  }

  return (
    <form onSubmit={submit} className="liquid-glass" style={{ borderRadius: '1.5rem', padding: 'clamp(28px,4vw,48px)', display: 'flex', flexDirection: 'column', gap: 24, maxWidth: 720, margin: '0 auto' }} noValidate>
      <input className="hp" tabIndex="-1" autoComplete="off" value={f.hp} onChange={set('hp')} />
      <Field label="What does your business do?" value={f.what} onChange={set('what')} error={errors.what} placeholder="We're a 20-person logistics firm doing last-mile delivery for e-commerce brands." />
      <ChipSelect label="How many people work there?" value={f.size} onChange={set('size')} error={errors.size} options={['Just me','2–10','11–50','51–200','200+']} />
      <ChipSelect label="Which area eats the most time?" value={f.area} onChange={set('area')} error={errors.area} options={['Operations and admin','Marketing and content','Sales and follow-up','Finance and accounts','Customer service','Not sure']} />
      <Field label="Walk us through one thing your team repeats every week." value={f.repeat} onChange={set('repeat')} error={errors.repeat} textarea placeholder="Someone pulls orders from three portals into a spreadsheet every Monday, then emails a summary to the warehouse." helper="The more specific, the better the report. Boring is good." />
      <ChipSelect label="What AI tools do you already use?" value={f.tools} onChange={set('tools')} error={errors.tools} options={['None yet','A couple, informally','Several, across the team',"We've built something custom"]} />
      <Field label="Have you tried something with AI that didn't work out?" value={f.failed} onChange={set('failed')} required={false} textarea helper="Most people have. It helps us more than almost anything else on this form." />
      <Field label="If you could fix one thing tomorrow, for free, what would it be?" value={f.fix} onChange={set('fix')} error={errors.fix} textarea />
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(200px,1fr))', gap: 16 }}>
        <Field label="Name" value={f.name} onChange={set('name')} error={errors.name} />
        <Field label="Work email" value={f.email} onChange={set('email')} error={errors.email} />
        <Field label="Company website" value={f.website} onChange={set('website')} required={false} />
      </div>
      <label style={{ display: 'flex', gap: 10, alignItems: 'flex-start', fontSize: 12.5, color: 'rgba(255,255,255,0.5)', lineHeight: 1.6 }}>
        <input type="checkbox" checked={agree} onChange={e => setAgree(e.target.checked)} style={{ marginTop: 3, accentColor: '#8A5CFF' }} />
        <span>I agree to AgenzI's <a href="AgenzI Privacy.html">Privacy Policy</a>. We'll use your details to prepare and send your report, and to follow up once. We won't add you to anything you didn't ask for.</span>
      </label>
      {errors.agree && <p style={{ fontSize: 12, color: '#F87171', marginTop: -12 }}>Please accept the privacy policy to continue.</p>}
      <button type="submit" style={{ borderRadius: 9999, padding: '15px 0', fontSize: 14, fontWeight: 600, color: '#fff', border: 'none', cursor: 'pointer', ...ctaGrad }}>Send me the report</button>
    </form>);
}

function App() {
  return (
    <div style={{ background: '#000', minHeight: '100vh' }}>
      <Navbar />
      <section style={{ padding: '180px clamp(24px,6vw,80px) 40px' }}>
        <div style={{ maxWidth: 720, margin: '0 auto', textAlign: 'center' }}>
          <div className="liquid-glass" style={{ ...kicker, margin: '0 auto 20px' }}>// Free AI Report</div>
          <h1 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(2rem,4.5vw,3.2rem)', color: '#fff', letterSpacing: '-2px', lineHeight: 1.1, marginBottom: 20 }}>Tell us how your business runs.</h1>
          <p style={{ fontSize: 15.5, color: 'rgba(255,255,255,0.6)', lineHeight: 1.7, marginBottom: 10 }}>We'll send back a short report on where AI would help, where it wouldn't, and roughly what it would take.</p>
          <p style={{ fontSize: 14.5, color: 'rgba(255,255,255,0.5)', lineHeight: 1.7, marginBottom: 8 }}>It's free. It's yours whether or not you work with us.</p>
          <p style={{ fontSize: 13, color: '#B983FF' }}>Two working days · eight questions · about four minutes</p>
        </div>
      </section>
      <section style={{ padding: '20px clamp(24px,6vw,80px) clamp(80px,10vw,120px)' }}>
        <FreeReportForm />
      </section>
      <Footer />
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
