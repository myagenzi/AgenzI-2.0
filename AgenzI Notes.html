<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgenzI — Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:transparent;color:#fff;font-family:'Space Grotesk',sans-serif;overflow-x:hidden;cursor:none}
#cursor-orb{position:fixed;top:0;left:0;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#FFD166 0%,#B983FF 45%,#3A6FD8 100%);box-shadow:0 0 12px 4px rgba(138,92,255,0.5),0 0 24px 8px rgba(255,178,0,0.2);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .08s ease,width .2s ease,height .2s ease,opacity .3s ease;mix-blend-mode:screen}
#cursor-trail{position:fixed;top:0;left:0;width:36px;height:36px;border-radius:50%;border:1px solid rgba(138,92,255,0.35);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .18s ease,width .3s ease,height .3s ease,opacity .3s ease;background:radial-gradient(circle,rgba(255,209,102,0.04) 0%,transparent 70%)}
body:hover #cursor-orb{opacity:1}
a:hover ~ #cursor-orb,button:hover ~ #cursor-orb{transform:translate(-50%,-50%) scale(1.6)}
.liquid-glass{background:rgba(255,255,255,0.01);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(145deg,rgba(185,131,255,0.35) 0%,rgba(58,111,216,0.15) 30%,rgba(255,255,255,0) 50%,rgba(217,70,239,0.1) 80%,rgba(255,178,0,0.2) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.liquid-glass-strong{background:rgba(108,63,207,0.06);backdrop-filter:blur(50px);-webkit-backdrop-filter:blur(50px);border:none;box-shadow:0 4px 24px rgba(138,92,255,0.12),inset 0 1px 1px rgba(185,131,255,0.2);position:relative;overflow:hidden}
.liquid-glass-strong::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(145deg,rgba(185,131,255,0.5) 0%,rgba(58,111,216,0.2) 30%,rgba(255,255,255,0) 50%,rgba(217,70,239,0.15) 80%,rgba(255,178,0,0.3) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#main-nav{transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s ease}
#main-nav.nav-hidden{transform:translateY(-110%);opacity:0}
.footer-compact{border-top:1px solid transparent;border-image:linear-gradient(to right,transparent,rgba(138,92,255,0.25),rgba(255,178,0,0.15),transparent) 1}
input::placeholder{color:rgba(255,255,255,0.35)}
::selection{background:rgba(138,92,255,0.35)}
a{color:#B983FF}
a:hover{color:#D9B8FF}
</style>
</head>
<body>
<div id="cursor-orb"></div>
<div id="cursor-trail"></div>
<video id="bg-video" autoplay muted loop playsinline src="side-rays-bg.mp4" style="position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2"></video>
<div style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:-1"></div>
<div id="root"></div>
<script src="logos.js"></script>
<script>
(function() {
  const orb = document.getElementById('cursor-orb');
  const trail = document.getElementById('cursor-trail');
  let mx = -100, my = -100, tx = -100, ty = -100;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function tick() {
    tx += (mx - tx) * 0.18;
    ty += (my - ty) * 0.18;
    orb.style.left = mx + 'px';
    orb.style.top = my + 'px';
    trail.style.left = tx + 'px';
    trail.style.top = ty + 'px';
    requestAnimationFrame(tick);
  }
  tick();
  document.addEventListener('mouseover', e => {
    if (e.target.closest('a, button')) {
      orb.style.width = '28px'; orb.style.height = '28px';
      orb.style.boxShadow = '0 0 20px 8px rgba(138,92,255,0.7), 0 0 40px 16px rgba(255,178,0,0.3)';
      trail.style.width = '56px'; trail.style.height = '56px';
      trail.style.borderColor = 'rgba(185,131,255,0.5)';
    }
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('a, button')) {
      orb.style.width = '18px'; orb.style.height = '18px';
      orb.style.boxShadow = '0 0 12px 4px rgba(138,92,255,0.5), 0 0 24px 8px rgba(255,178,0,0.2)';
      trail.style.width = '36px'; trail.style.height = '36px';
      trail.style.borderColor = 'rgba(138,92,255,0.35)';
    }
  });
})();
</script>
<script type="text/babel">
const { useRef, useEffect, useState } = React;

function ArrowUpRight({ size = 20 }) {
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7" /><polyline points="7 7 17 7 17 17" /></svg>);
}

function Navbar() {
  const lastY = useRef(0);
  useEffect(() => {
    const nav = document.getElementById('main-nav');
    const onScroll = () => {
      const y = window.scrollY;
      if (y < 60) nav.classList.remove('nav-hidden');
      else if (y > lastY.current + 8) nav.classList.add('nav-hidden');
      else if (y < lastY.current - 8) nav.classList.remove('nav-hidden');
      lastY.current = y;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const links = [['Services','AgenzI Services.html'],['Work','AgenzI Work.html'],['Pricing','AgenzI Pricing.html'],['Notes','AgenzI Notes.html'],['About','AgenzI About.html']];
  return (
    <nav id="main-nav" style={{ position: 'fixed', top: 16, left: 0, right: 0, zIndex: 50, padding: '0 2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <a href="AgenzI.html" style={{ display: 'flex', alignItems: 'center', flexShrink: 0 }}>
        <img src={window.LOGO_HORIZONTAL} alt="AgenzI" style={{ height: 48, display: 'block', objectFit: 'contain' }} />
      </a>
      <div className="liquid-glass" style={{ display: 'flex', alignItems: 'center', borderRadius: 9999, padding: '6px 6px', gap: 2 }}>
        {links.map(([label, href]) =>
          <a key={label} href={href} style={{ padding: '8px 14px', fontSize: 13, fontWeight: label === 'Notes' ? 600 : 500, color: label === 'Notes' ? '#B983FF' : 'rgba(255,255,255,0.85)', textDecoration: 'none', borderRadius: 9999 }}>{label}</a>
        )}
        <a href="AgenzI Free Report.html" style={{ padding: '8px 18px', fontSize: 13, fontWeight: 600, background: 'linear-gradient(135deg, #6C3FCF, #3A6FD8)', color: '#fff', borderRadius: 9999, textDecoration: 'none', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: 6, boxShadow: '0 0 16px rgba(108,63,207,0.4)' }}>Get your free AI report</a>
      </div>
      <div style={{ width: 64 }}></div>
    </nav>);
}

function Footer() {
  return (
    <footer className="footer-compact" style={{ padding: '32px clamp(24px, 6vw, 80px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <img src={window.LOGO_HORIZONTAL} alt="AgenzI" style={{ height: 36, objectFit: 'contain', display: 'block' }} />
          <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)' }}>Create · Market · Run</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          {['Services', 'Work', 'Notes', 'Pricing', 'About', 'Zenzai', 'AI Audit', 'Privacy', 'Terms'].map(l =>
            <a key={l} href={{Services:'AgenzI Services.html',Work:'AgenzI Work.html',Notes:'AgenzI Notes.html',Pricing:'AgenzI Pricing.html',About:'AgenzI About.html','AI Audit':'AgenzI Audit.html',Privacy:'AgenzI Privacy.html',Terms:'AgenzI Terms.html'}[l] || '#'} style={{ fontSize: 11, color: 'rgba(255,255,255,0.3)', textDecoration: 'none' }}>{l}</a>)}
        </div>
      </div>
      <p style={{ textAlign: 'center', fontSize: 11, color: 'rgba(255,255,255,0.2)', marginTop: 20 }}>© 2026 AgenzI. All rights reserved.</p>
    </footer>);
}

const kicker = { display: 'inline-flex', borderRadius: 9999, padding: '5px 16px', fontSize: 12, color: 'rgba(255,255,255,0.6)', marginBottom: 20 };
const h2Style = { fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(2rem, 4.2vw, 3.2rem)', color: '#fff', lineHeight: 1.08, letterSpacing: '-2px', maxWidth: 760, marginBottom: 16 };
const bodyMuted = { fontSize: 14, color: 'rgba(255,255,255,0.55)', lineHeight: 1.7 };
const ctaGrad = { background: 'linear-gradient(135deg,#6C3FCF,#3A6FD8)' };

/* ── Hero ── */
function Hero() {
  return (
    <section style={{ padding: '200px clamp(24px,6vw,80px) 60px', textAlign: 'center' }}>
      <div className="liquid-glass" style={kicker}>// NOTES</div>
      <h1 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(2.4rem,6vw,4.6rem)', color: '#fff', letterSpacing: '-3px', lineHeight: 1.05, maxWidth: 820, margin: '0 auto 20px' }}>Ideas on human plus AI work.</h1>
      <p style={{ fontSize: 17, color: 'rgba(255,255,255,0.55)', lineHeight: 1.6, maxWidth: 620, margin: '0 auto' }}>Practical notes on strategy, operations, design, marketing and the culture of working with AI.</p>
    </section>);
}

/* ── Featured ── */
function Featured() {
  return (
    <section style={{ padding: '0 clamp(24px,6vw,80px) clamp(70px,10vw,110px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <div className="liquid-glass" style={kicker}>// Featured</div>
        <div className="liquid-glass-strong" style={{ borderRadius: '1.75rem', padding: 'clamp(32px,5vw,56px)', display: 'flex', flexDirection: 'column', gap: 18 }}>
          <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 1, color: '#8A5CFF' }}>AI IN PRACTICE</span>
          <h2 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(1.8rem,3.4vw,2.6rem)', color: '#fff', letterSpacing: '-1.5px', lineHeight: 1.1, maxWidth: 680 }}>What is AgenzI?</h2>
          <p style={{ fontSize: 15, color: 'rgba(255,255,255,0.6)', lineHeight: 1.7, maxWidth: 640 }}>AgenzI is a human-led, AI-accelerated agency. We use AI to do work faster, and people to decide what work is worth doing.</p>
          <a href="#" style={{ marginTop: 8, display: 'inline-flex', alignItems: 'center', gap: 8, fontSize: 14, fontWeight: 600, color: '#fff', textDecoration: 'none' }}>Read featured note <ArrowUpRight size={16} /></a>
        </div>
      </div>
    </section>);
}

/* ── Subscribe ── */
function Subscribe() {
  return (
    <section id="subscribe" style={{ padding: '0 clamp(24px,6vw,80px) clamp(70px,10vw,110px)' }}>
      <div className="liquid-glass" style={{ maxWidth: 1100, margin: '0 auto', borderRadius: '1.5rem', padding: 'clamp(28px,4vw,40px)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ maxWidth: 420 }}>
          <h3 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 20, color: '#fff', marginBottom: 6 }}>Subscribe to Notes</h3>
          <p style={{ fontSize: 13.5, color: 'rgba(255,255,255,0.5)', lineHeight: 1.6 }}>One email when we publish something worth reading. No spam, no noise.</p>
        </div>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', flex: '1 1 320px', justifyContent: 'flex-end' }}>
          <input type="email" placeholder="you@company.com" style={{ flex: '1 1 220px', minWidth: 200, background: 'rgba(255,255,255,0.04)', border: '1px solid rgba(255,255,255,0.15)', borderRadius: 9999, padding: '13px 20px', fontSize: 13, color: '#fff' }} />
          <button style={{ borderRadius: 9999, padding: '13px 26px', fontSize: 13, fontWeight: 600, color: '#fff', border: 'none', cursor: 'pointer', whiteSpace: 'nowrap', ...ctaGrad }}>Subscribe</button>
        </div>
      </div>
    </section>);
}

/* ── Notes grid ── */
function NotesGrid() {
  const cats = ['All', 'AI in practice', 'Strategy', 'Operations', 'Design', 'Marketing', 'Culture'];
  const notes = [
    { cat: 'AI in practice', title: 'Human plus AI: how we actually work', body: 'AI does the draft. The human does the decision. Here is the split we use on every project.', read: '4 min read' },
    { cat: 'Strategy', title: 'Why our pricing is published', body: 'Agencies hide pricing because it creates leverage. We removed the leverage and replaced it with clarity.', read: '3 min read' },
    { cat: 'Operations', title: 'Is an AI audit worth it?', body: 'A one-hour audit can save you months of wrong turns. Here is what we look for.', read: '3 min read' },
    { cat: 'Design', title: 'Design systems for small teams', body: 'A design system is not a luxury. It is how a small team keeps quality high without hiring more people.', read: '4 min read' },
    { cat: 'Operations', title: 'When to automate, when to leave it alone', body: 'Automation is tempting. But not every process should be automated. Here is the test we use.', read: '3 min read' },
  ];
  const [active, setActive] = useState('All');
  const visible = active === 'All' ? notes : notes.filter(n => n.cat === active);
  return (
    <section style={{ padding: '0 clamp(24px,6vw,80px) clamp(80px,12vw,140px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto' }}>
        <div style={{ display: 'flex', gap: 10, flexWrap: 'wrap', marginBottom: 32 }}>
          {cats.map(c =>
            <button key={c} onClick={() => setActive(c)} style={{ fontSize: 13, padding: '9px 18px', borderRadius: 9999, cursor: 'pointer', border: active === c ? '1px solid rgba(138,92,255,0.5)' : '1px solid rgba(255,255,255,0.15)', background: active === c ? 'rgba(138,92,255,0.15)' : 'rgba(255,255,255,0.03)', color: active === c ? '#B983FF' : 'rgba(255,255,255,0.6)' }}>{c}</button>)}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(280px,1fr))', gap: 16 }}>
          {visible.map(n =>
            <div key={n.title} className="liquid-glass" style={{ borderRadius: '1.5rem', padding: 26, display: 'flex', flexDirection: 'column', gap: 14 }}>
              <span style={{ fontSize: 11, fontWeight: 700, letterSpacing: 1, color: '#8A5CFF' }}>{n.cat.toUpperCase()}</span>
              <h3 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 18, color: '#fff', lineHeight: 1.3 }}>{n.title}</h3>
              <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.5)', lineHeight: 1.6 }}>{n.body}</p>
              <div style={{ marginTop: 'auto', paddingTop: 12, borderTop: '1px solid rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
                <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)' }}>{n.read}</span>
                <a href="#" style={{ fontSize: 13, fontWeight: 600, color: '#fff', textDecoration: 'none', display: 'inline-flex', alignItems: 'center', gap: 6 }}>Read <ArrowUpRight size={14} /></a>
              </div>
            </div>)}
        </div>
      </div>
    </section>);
}

/* ── Final CTA ── */
function FinalCTA() {
  return (
    <section id="cta" style={{ padding: 'clamp(80px, 12vw, 140px) clamp(24px, 6vw, 80px)', textAlign: 'center' }}>
      <div style={{ maxWidth: 700, margin: '0 auto' }}>
        <h2 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(2rem, 4.2vw, 3.2rem)', color: '#fff', letterSpacing: '-2px', marginBottom: 16 }}>Want to put these ideas into practice?</h2>
        <p style={{ ...bodyMuted, marginBottom: 32 }}>Book an AI audit and we will map the first three things you should change.</p>
        <a href="AgenzI Audit.html" style={{ display: 'inline-flex', alignItems: 'center', gap: 8, borderRadius: 9999, padding: '13px 30px', fontSize: 14, fontWeight: 600, color: '#fff', textDecoration: 'none', ...ctaGrad, boxShadow: '0 0 24px rgba(108,63,207,0.45)' }}>Book an AI audit <ArrowUpRight size={16} /></a>
      </div>
    </section>);
}

function App() {
  return (
    <div style={{ minHeight: '100vh' }}>
      <Navbar />
      <Hero />
      <Featured />
      <Subscribe />
      <NotesGrid />
      <FinalCTA />
      <Footer />
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
