<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgenzI — Privacy Policy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:#000;color:#fff;font-family:'Space Grotesk',sans-serif;overflow-x:hidden;cursor:none}
#cursor-orb{position:fixed;top:0;left:0;width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#FFD166 0%,#B983FF 45%,#3A6FD8 100%);box-shadow:0 0 12px 4px rgba(138,92,255,0.5),0 0 24px 8px rgba(255,178,0,0.2);pointer-events:none;z-index:9999;transform:translate(-50%,-50%);transition:transform .08s ease,width .2s ease,height .2s ease,opacity .3s ease;mix-blend-mode:screen}
#cursor-trail{position:fixed;top:0;left:0;width:36px;height:36px;border-radius:50%;border:1px solid rgba(138,92,255,0.35);pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:transform .18s ease,width .3s ease,height .3s ease,opacity .3s ease;background:radial-gradient(circle,rgba(255,209,102,0.04) 0%,transparent 70%)}
body:hover #cursor-orb{opacity:1}
a:hover ~ #cursor-orb,button:hover ~ #cursor-orb{transform:translate(-50%,-50%) scale(1.6)}
.liquid-glass{background:rgba(255,255,255,0.01);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;box-shadow:inset 0 1px 1px rgba(255,255,255,0.1);position:relative;overflow:hidden}
.liquid-glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1.4px;background:linear-gradient(145deg,rgba(185,131,255,0.35) 0%,rgba(58,111,216,0.15) 30%,rgba(255,255,255,0) 50%,rgba(217,70,239,0.1) 80%,rgba(255,178,0,0.2) 100%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
#main-nav{transition:transform .4s cubic-bezier(.4,0,.2,1),opacity .4s ease}
#main-nav.nav-hidden{transform:translateY(-110%);opacity:0}
.footer-compact{border-top:1px solid transparent;border-image:linear-gradient(to right,transparent,rgba(138,92,255,0.25),rgba(255,178,0,0.15),transparent) 1}
::selection{background:rgba(138,92,255,0.35)}
a{color:#B983FF}
a:hover{color:#D9B8FF}
.ph{color:#FFB300;border-bottom:1px dashed rgba(255,178,0,0.5)}
.legal-table{width:100%;border-collapse:collapse;font-size:13px}
.legal-table th,.legal-table td{text-align:left;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.65)}
.legal-table th{color:rgba(255,255,255,0.4);font-weight:600;font-size:11px;letter-spacing:0.5px;text-transform:uppercase}
</style>
</head>
<body>
<div id="cursor-orb"></div>
<div id="cursor-trail"></div>
<div id="root"></div>
<script src="logos.js"></script>
<script>
(function() {
  const orb = document.getElementById('cursor-orb');
  const trail = document.getElementById('cursor-trail');
  let mx = -100, my = -100, tx = -100, ty = -100;
  document.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });
  function tick() {
    tx += (mx - tx) * 0.18; ty += (my - ty) * 0.18;
    orb.style.left = mx + 'px'; orb.style.top = my + 'px';
    trail.style.left = tx + 'px'; trail.style.top = ty + 'px';
    requestAnimationFrame(tick);
  }
  tick();
  document.addEventListener('mouseover', e => {
    if (e.target.closest('a, button')) {
      orb.style.width = '28px'; orb.style.height = '28px';
      orb.style.boxShadow = '0 0 20px 8px rgba(138,92,255,0.7), 0 0 40px 16px rgba(255,178,0,0.3)';
      trail.style.width = '56px'; trail.style.height = '56px';
      trail.style.borderColor = 'rgba(185,131,255,0.5)';
    }
  });
  document.addEventListener('mouseout', e => {
    if (e.target.closest('a, button')) {
      orb.style.width = '18px'; orb.style.height = '18px';
      orb.style.boxShadow = '0 0 12px 4px rgba(138,92,255,0.5), 0 0 24px 8px rgba(255,178,0,0.2)';
      trail.style.width = '36px'; trail.style.height = '36px';
      trail.style.borderColor = 'rgba(138,92,255,0.35)';
    }
  });
})();
</script>
<script type="text/babel">
const { useRef, useEffect } = React;

function Navbar() {
  const lastY = useRef(0);
  useEffect(() => {
    const nav = document.getElementById('main-nav');
    const onScroll = () => {
      const y = window.scrollY;
      if (y < 60) nav.classList.remove('nav-hidden');
      else if (y > lastY.current + 8) nav.classList.add('nav-hidden');
      else if (y < lastY.current - 8) nav.classList.remove('nav-hidden');
      lastY.current = y;
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  const links = [['Services','AgenzI Services.html'],['Work','AgenzI Work.html'],['Pricing','AgenzI Pricing.html'],['Notes','AgenzI Notes.html'],['About','AgenzI About.html']];
  return (
    <nav id="main-nav" style={{ position: 'fixed', top: 16, left: 0, right: 0, zIndex: 50, padding: '0 2rem', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
      <a href="AgenzI.html" style={{ display: 'flex', alignItems: 'center', flexShrink: 0 }}>
        <img src={window.LOGO_HORIZONTAL} alt="AgenzI" style={{ height: 48, display: 'block', objectFit: 'contain' }} />
      </a>
      <div className="liquid-glass" style={{ display: 'flex', alignItems: 'center', borderRadius: 9999, padding: '6px 6px', gap: 2 }}>
        {links.map(([label, href]) =>
          <a key={label} href={href} style={{ padding: '8px 14px', fontSize: 13, fontWeight: 500, color: 'rgba(255,255,255,0.85)', textDecoration: 'none', borderRadius: 9999 }}>{label}</a>
        )}
        <a href="AgenzI Free Report.html" style={{ padding: '8px 18px', fontSize: 13, fontWeight: 600, background: 'linear-gradient(135deg, #6C3FCF, #3A6FD8)', color: '#fff', borderRadius: 9999, textDecoration: 'none', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: 6, boxShadow: '0 0 16px rgba(108,63,207,0.4)' }}>Get your free AI report</a>
      </div>
      <div style={{ width: 64 }}></div>
    </nav>);
}

function Footer() {
  return (
    <footer className="footer-compact" style={{ padding: '32px clamp(24px, 6vw, 80px)' }}>
      <div style={{ maxWidth: 1100, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16 }}>
          <img src={window.LOGO_HORIZONTAL} alt="AgenzI" style={{ height: 36, objectFit: 'contain', display: 'block' }} />
          <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.35)' }}>Create · Market · Run</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 16, flexWrap: 'wrap' }}>
          {['Services', 'Work', 'Notes', 'Pricing', 'About', 'Zenzai', 'AI Audit', 'Privacy', 'Terms'].map(l =>
            <a key={l} href={{Services:'AgenzI Services.html',Work:'AgenzI Work.html',Notes:'AgenzI Notes.html',Pricing:'AgenzI Pricing.html',About:'AgenzI About.html','AI Audit':'AgenzI Audit.html',Privacy:'AgenzI Privacy.html',Terms:'AgenzI Terms.html'}[l] || '#'} style={{ fontSize: 11, color: l === 'Privacy' ? '#B983FF' : 'rgba(255,255,255,0.3)', textDecoration: 'none' }}>{l}</a>)}
        </div>
      </div>
      <p style={{ textAlign: 'center', fontSize: 11, color: 'rgba(255,255,255,0.2)', marginTop: 20 }}>© 2026 AgenzI. All rights reserved.</p>
    </footer>);
}

function Ph({ children }) { return <span className="ph">{children}</span>; }
function P({ children }) { return <p style={{ fontSize: 14, color: 'rgba(255,255,255,0.65)', lineHeight: 1.75, marginBottom: 14 }}>{children}</p>; }
function H({ children }) { return <h2 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 700, fontSize: 20, color: '#fff', margin: '36px 0 12px' }}>{children}</h2>; }
function Li({ items }) { return <ul style={{ margin: '0 0 14px 20px', display: 'flex', flexDirection: 'column', gap: 6 }}>{items.map((it,i) => <li key={i} style={{ fontSize: 14, color: 'rgba(255,255,255,0.65)', lineHeight: 1.6 }}>{it}</li>)}</ul>; }

function App() {
  return (
    <div style={{ background: '#000', minHeight: '100vh' }}>
      <Navbar />
      <section style={{ padding: '180px clamp(24px,6vw,80px) 40px' }}>
        <div style={{ maxWidth: 760, margin: '0 auto' }}>
          <div className="liquid-glass" style={{ display: 'inline-flex', borderRadius: 9999, padding: '5px 16px', fontSize: 12, color: 'rgba(255,255,255,0.6)', marginBottom: 20 }}>// Legal</div>
          <h1 style={{ fontFamily: "'Bricolage Grotesque', sans-serif", fontWeight: 800, fontSize: 'clamp(2rem,4.5vw,3rem)', color: '#fff', letterSpacing: '-2px', marginBottom: 12 }}>Privacy Policy</h1>
          <p style={{ fontSize: 13, color: 'rgba(255,255,255,0.4)', marginBottom: 20 }}>Last updated: <Ph>[DATE]</Ph></p>
          <div className="liquid-glass" style={{ borderRadius: '1rem', padding: 18, marginBottom: 8 }}>
            <p style={{ fontSize: 12.5, color: '#FFB300', lineHeight: 1.6 }}>Draft pending legal review. Bracketed fields (highlighted) must be completed with real business details before this policy is published live.</p>
          </div>
        </div>
      </section>
      <section style={{ padding: '0 clamp(24px,6vw,80px) clamp(80px,10vw,120px)' }}>
        <div className="liquid-glass" style={{ maxWidth: 760, margin: '0 auto', borderRadius: '1.5rem', padding: 'clamp(28px,4vw,48px)' }}>

          <H>Who we are</H>
          <P>AgenzI is <Ph>[a business / a registered company]</Ph> operating from <Ph>[CITY, COUNTRY]</Ph>. <Ph>[If registered: legal entity name, registration number, registered address. If operating under a parent company, state it plainly.]</Ph></P>
          <P>Questions about this policy or your data: <Ph>[EMAIL]</Ph></P>

          <H>What this covers</H>
          <P>This policy explains what we collect when you use our website or work with us, why we collect it, who else sees it, and what you can ask us to do about it.</P>

          <H>What we collect</H>
          <Li items={[
            <><strong style={{color:'#fff'}}>When you fill in a form</strong> — your name, work email, company name, company website, and whatever you tell us about how your business works.</>,
            <><strong style={{color:'#fff'}}>When you subscribe to Notes</strong> — your email address and, if you give it, your first name.</>,
            <><strong style={{color:'#fff'}}>When you become a client</strong> — business information needed to do the work: brand materials, documents, account access, files you share with us, and billing details.</>,
            <><strong style={{color:'#fff'}}>When you visit the site</strong> — standard analytics: pages visited, approximate location by country, device type, how you arrived. We use <Ph>[ANALYTICS TOOL]</Ph> for this.</>,
          ]} />
          <P>What we don't collect: we do not buy contact lists, we do not track you across other websites, and we do not sell your information to anyone, ever.</P>

          <H>Why we collect it</H>
          <Li items={['To write and send the report or audit you asked for','To do the work you hired us to do','To send you the newsletter, if you asked for it','To invoice you','To improve the website','To meet legal and tax obligations']} />
          <P>We will follow up <strong style={{color:'#fff'}}>once</strong> on a form submission. After that, we only contact you if you reply or ask us to.</P>

          <H>Who else sees it</H>
          <P>We use third-party services to run the business. Each one may process some of your information:</P>
          <table className="legal-table" style={{ marginBottom: 16 }}>
            <thead><tr><th>What it does</th><th>Service</th></tr></thead>
            <tbody>
              {[['Website hosting','[e.g. Vercel, Netlify]'],['Form submissions','[e.g. Tally, Typeform]'],['Email','[e.g. Google Workspace]'],['Newsletter','[e.g. MailerLite, Beehiiv]'],['Analytics','[e.g. Plausible, GA4]'],['Payments','[e.g. Skydo, Razorpay]'],['File storage','[e.g. Google Drive]'],['Project management','[e.g. Notion]']].map(([a,b]) =>
                <tr key={a}><td>{a}</td><td><Ph>{b}</Ph></td></tr>)}
            </tbody>
          </table>
          <P><strong style={{color:'#fff'}}>AI services.</strong> We use AI tools to help produce work. Depending on the project, this may include <Ph>[list every one — e.g. Anthropic Claude, OpenAI, Runway, ElevenLabs, Midjourney]</Ph>.</P>
          <P>We use business or API tiers of these services, which do not use submitted content to train their models. We do not put client data into consumer-tier AI tools. If a project requires a tool we haven't listed here, we will tell you before we start.</P>

          <H>Where your data is stored</H>
          <P>Our team works from <Ph>[COUNTRY]</Ph>. The services listed above store data in <Ph>[list regions — e.g. the United States, the European Union, India]</Ph>. If you need your data held in a specific region, tell us before we start and we will confirm whether we can do it.</P>

          <H>How long we keep it</H>
          <table className="legal-table" style={{ marginBottom: 16 }}>
            <tbody>
              <tr><td>Form submissions where you didn't become a client</td><td><strong style={{color:'#fff'}}>24 months</strong></td></tr>
              <tr><td>Client project files</td><td><strong style={{color:'#fff'}}>Duration of engagement + 24 months</strong></td></tr>
              <tr><td>Newsletter subscribers</td><td>Until you unsubscribe</td></tr>
              <tr><td>Invoices and tax records</td><td>As required by law <Ph>[typically 7 years in India]</Ph></td></tr>
              <tr><td>Analytics</td><td><Ph>[per tool default]</Ph></td></tr>
            </tbody>
          </table>
          <P>Ask us to delete your data sooner and we will, except where we are legally required to keep it.</P>

          <H>What you can ask for</H>
          <P>Wherever you are, you can ask us to tell you what we hold about you, correct anything wrong, delete it, send it to you in a usable format, or stop using it for a particular purpose. Email <Ph>[EMAIL]</Ph> — we will respond within <strong style={{color:'#fff'}}>30 days</strong>.</P>
          <P><strong style={{color:'#fff'}}>Canada</strong> — rights under PIPEDA, plus Quebec Law 25 rights if you're in Quebec. <strong style={{color:'#fff'}}>United States</strong> — depending on your state, rights under CCPA/CPRA or similar; we do not sell personal information. <strong style={{color:'#fff'}}>India</strong> — rights under the Digital Personal Data Protection Act, including the right to withdraw consent.</P>

          <H>Cookies</H>
          <P>We use <Ph>[ANALYTICS TOOL]</Ph> to understand how people use the site. <Ph>[If cookieless: no cookie banner because there are no tracking cookies. If Google Analytics: cookies are set — decline non-essential cookies via the banner or your browser.]</Ph></P>

          <H>Children</H>
          <P>Our services are for businesses. We do not knowingly collect information from anyone under 18.</P>

          <H>Changes</H>
          <P>If we change this policy we will update the date at the top. If the change is significant and we have your email, we will tell you.</P>

          <H>Contact</H>
          <P><Ph>[EMAIL]</Ph><br/><Ph>[POSTAL ADDRESS]</Ph></P>
        </div>
      </section>
      <Footer />
    </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
